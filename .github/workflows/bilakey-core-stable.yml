name: Build BilaKey Core Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BilaKey Core Stable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Gate check source
        run: |
          python3 tools/verify_source.py
          mkdir -p out
          javac -encoding UTF-8 -d out app/src/main/java/com/cvnss/bilakey/CvnssConverter.java tools/TestCvnssConverter.java
          java -cp out com.cvnss.bilakey.TestCvnssConverter

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifact
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Found APK: $APK"
          test -n "$APK"
          cp "$APK" artifact/BilaKey_CoreStable_v1_2_2.apk
          sha256sum artifact/BilaKey_CoreStable_v1_2_2.apk | tee artifact/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BilaKey_CoreStable_v1_2_2_APK
          path: artifact/
